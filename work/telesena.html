  <script type="text/babel">
    const data = {
      client: "Silvio Santos Group",
      role: "Senior Product Designer",
      year: "2024 – 2025",
      scope: "Design system · Web platform",
      title: <>Tele Sena, a <span className="serif">system</span> rebuilt.</>,
      lead: <>Restructuring the design system behind one of Brazil's best-known capitalization bonds, where people check results, redeem prizes and buy, all in one place.</>,
      cover: "https://framerusercontent.com/images/6eWjjIG48XJday0WL9mYH9Yg5Hw.jpg",
      coverAlt: "Tele Sena platform screens",

      context: [
        "Tele Sena is a single-payment capitalization bond launched by the Silvio Santos Group in November 1991. Millions of people use it to check results, redeem prizes and enter weekly draws.",
        "<span class='muted'>By 2024 the platform had grown organically for over three decades. Components were duplicated, behaviour was inconsistent across flows, and shipping anything new meant re-solving problems that had already been solved elsewhere in the product.</span>",
      ],
      challenge: [
        "The system had to absorb years of edge cases (legal copy, accessibility requirements, high-trust financial flows) without losing the familiarity long-time users depend on.",
        "I was brought in to lead the restructure: audit what existed, define the foundation, rebuild the components, and hand off a system the internal team could evolve without me.",
      ],

      approachTitle: "Audit, foundation, scale",
      approach: [
        "Phase one was an inventory: every screen in the product, every component in Figma and every variant in production, 400+ artefacts in all, sorted into keep, merge and remove.",
        "Phase two was the foundation: a token layer for colour, spacing, type, elevation and motion that every component references, replacing hard-coded hex values and one-off padding.",
        "<span class='muted'>Phase three was the build: base components first, then patterns, then full page templates. Every component shipped with documentation, usage rules and do/don't examples.</span>",
      ],
      decisions: [
        "<strong>Tokens for everything</strong>: colour, type, spacing, radius and elevation. Components can't use raw values.",
        "<strong>One source of truth</strong>: the Figma library mirrors production. A change in one updates the other, and deprecated components carry a visible flag.",
        "<strong>Accessibility at publish</strong>: every component ships with contrast, focus, keyboard and screen-reader specs, checked before it can be published rather than in a later audit.",
        "<strong>Docs beside components</strong>: usage rules live next to each component instead of in a separate deck.",
      ],

      outcome: [
        "The restructured system is now the foundation of Tele Sena's platform. The team ships faster because it no longer redesigns the same button, and the product feels consistent again from purchase through redemption.",
      ],
      metrics: [
        { n: "400+", l: "Artefacts audited" },
        { n: "1", l: "Source of truth" },
        { n: "+55%", l: "Shipping speed" },
        { n: "WCAG AA", l: "Baseline contrast" },
      ],
      reflection: [
        "Every component was a compromise between designers who wanted control, developers who wanted consistency and product managers who wanted speed. It worked when all three got enough of what they needed.",
        "<span class='muted'>The biggest lesson was how much of the work is documentation. Without it, the team would have had a pile of components they couldn't use on their own.</span>",
      ],
      next: { name: "Ranger Scroll Drive", href: "ranger.html" },
