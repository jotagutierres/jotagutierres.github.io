    };
    function update404() {
      const locale = SiteI18n.getLocale();
      const copy = copy404[locale];
      document.querySelectorAll("[data-i18n]").forEach((node) => { node.textContent = copy[node.dataset.i18n]; });
      document.querySelector(".nav__role").textContent = copy.role;
      document.querySelector(".nav__links .-optional").textContent = copy.experience;
      document.querySelector(".nav__cta").textContent = copy.contact;
      document.querySelector("nav").setAttribute("aria-label", locale === "pt" ? "Navegação principal" : "Main");
      document.querySelector("h1").setAttribute("aria-label", locale === "pt" ? "Erro 404" : "Error 404");
      document.querySelector(".lang-switch").setAttribute("aria-label", locale === "pt" ? "Idioma" : "Language");
      document.querySelectorAll("[data-lang]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.lang === locale)));
      document.querySelectorAll("a[href^='/']").forEach((link) => { link.href = SiteI18n.link(link.getAttribute("href")); });
      document.title = locale === "pt" ? "Página não encontrada — Carlos Gutierres" : "Page not found — Carlos Gutierres";
      document.querySelector('meta[name="description"]').content = locale === "pt" ? "Esta página não foi encontrada. Volte ao portfólio de design de produto de Carlos Gutierres." : "This page could not be found. Return to Carlos Gutierres's product design portfolio.";
    }
    document.querySelectorAll("[data-lang]").forEach((button) => button.addEventListener("click", () => SiteI18n.setLocale(button.dataset.lang)));
    window.addEventListener("portfolio-language-change", update404);
    update404();
  </script>
