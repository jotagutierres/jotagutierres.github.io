  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../src/primitives.jsx"></script>
  <script type="text/babel" src="../src/case-study.jsx"></script>
  <script type="text/babel">
    const data = {
      client: "Ford Motor Company",
      role: "UI / UX Designer",
      year: "2021",
      scope: "Interactive campaign",
      title: <>Ranger Scroll <span className="serif">Drive.</span></>,
      lead: <>During lockdown nobody could test-drive the new Ranger, so we built a test drive in the browser that you steer with your scroll wheel.</>,
      cover: "https://framerusercontent.com/images/mV7iW9VZk0QREGOTfWRoRTglcM.jpg",
      coverAlt: "Ford Ranger driving through terrain in the Scroll Drive experience",

      context: [
        "2020 and 2021 changed how people shop for cars. Showrooms closed, test drives stopped, and the usual path from TV ad to dealership visit fell apart. Ford Brazil had a new Ranger to launch and no way to let people experience it.",
        "<span class='muted'>The brief: build something that lets a potential buyer <em>feel</em> the Ranger at home, on whatever device they happen to have open.</span>",
      ],
      challenge: [
        "Digital test drives are usually video tours with a click-through menu, and people just watch. We wanted something they would drive themselves.",
        "Constraints were tight: it had to work on desktop <em>and</em> mobile, load fast on Brazilian connections, show the vehicle from several angles, and end with a clear hand-off to the dealer network.",
      ],

      approachTitle: "Scroll as the wheel",
      approach: [
        "The core idea came early: use the scroll wheel as the steering input. Scroll down and the Ranger moves forward through the terrain, scroll up and it reverses, and the arrow keys steer.",
        "We storyboarded four environments (mud, rock, a river crossing and the city), each showing a different Ranger capability. Each one ended on a camera angle that revealed a feature: off-road modes, ground clearance, towing or infotainment.",
        "<span class='muted'>On mobile, scrolling became swiping. We tuned the physics so it felt the same on every device, which took half the engineering effort.</span>",
      ],
      decisions: [
        "<strong>Scroll as steering</strong>: everyone already knows how to scroll, so there's no tutorial or onboarding.",
        "<strong>Four environments, four features</strong>: each terrain shows one reason to buy the truck, with no voice-over needed.",
        "<strong>Continuous pacing</strong>: the drive is a series of pre-rendered scenes, loaded ahead so each one hands off smoothly to the next.",
        "<strong>Dealer hand-off</strong>: the drive ends with one tap to <em>reserve a real test drive near you</em>, turning curiosity into a showroom visit.",
      ],

      outcome: [
        "Ranger Scroll Drive was one of the campaign's most-shared pieces. People spent longer with the Ranger on this site than they would have on a showroom floor, and the dealer hand-off kept the top of the funnel full when nothing else could.",
      ],
      metrics: [
        { n: "4.2 min", l: "Average time on page" },
        { n: "+310%", l: "Against the campaign benchmark" },
        { n: "4", l: "Terrain environments" },
      ],
      reflection: [
        "The best input is one people already know. We gave scrolling a new job, and people understood it immediately.",
        "<span class='muted'>I still think about this project when a brief asks for \"engagement\". What holds people is something to do with their hands, more than something to watch.</span>",
      ],
      next: { name: "FordPass CRM", href: "fordcase.html" },
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CaseStudyPage data={data} />);
