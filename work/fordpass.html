  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="../src/primitives.jsx"></script>
  <script type="text/babel" src="../src/case-study.jsx"></script>
  <script type="text/babel">
    const data = {
      client: "Ford Motor Company",
      role: "Product Designer",
      year: "2022 – 2023",
      scope: "Mobile app · Design system",
      title: <>FordPass®, <span className="serif">the connected</span> drive.</>,
      lead: <>Redesigning how Ford owners in Brazil use the app every day, from remote start to booking a service.</>,
      cover: "https://framerusercontent.com/images/VRKHcCTF7ctnBzXxlql8cKU4Xys.jpg",
      coverAlt: "FordPass app screens",

      context: [
        "FordPass is Ford's global companion app for vehicle owners. In Brazil it handles remote commands, vehicle health, service booking, dealer relationships and loyalty rewards in a single app.",
        "<span class='muted'>I designed the Brazilian version, adapting global patterns to how drivers here deal with their car, their dealer and their city.</span>",
      ],
      challenge: [
        "The existing flows mixed transactional tasks (pay for a service, schedule maintenance) with relational ones (vehicle status, loyalty status, news from Ford). People arrived with a clear intent and had to navigate around content to find it.",
        "We needed to rebuild the experience around <strong>intent</strong>: the vehicle, its status and the next available action at the centre of the home screen, while keeping the communication space Ford's marketing team relies on.",
      ],

      approachTitle: "Put the vehicle first",
      approach: [
        "We started by mapping the six most frequent user intents, from <em>\"I want to start my car\"</em> to <em>\"I need to schedule a service\"</em>, and counted the taps between opening the app and resolving each one.",
        "Then we rebuilt the information architecture around those intents. The home screen stopped being a marketing surface and became a live dashboard: vehicle status on top, one primary action below, everything else still reachable but lower down.",
        "<span class='muted'>In parallel, I worked with the global design system team to extend components for Brazil: payment methods, CPF fields, service taxonomy and local dealer network data.</span>",
      ],
      decisions: [
        "Cut 5 tabs to 3 (<strong>Home, Services, Account</strong>), so there's less to take in on first open.",
        "Introduced a <strong>status-first home</strong> with a vehicle snapshot, the next action and a single communication slot instead of a carousel of banners.",
        "Standardised every flow to finish in <strong>4 steps or fewer</strong>, with the same confirmation pattern across the whole app.",
        "Built a <strong>dealer scheduling flow</strong> modelled on booking a ride: dates, times and service types are cards to tap instead of dropdowns.",
      ],

      outcome: [
        "The redesigned home shipped to Brazilian users and became the template for how local flows are structured inside FordPass. Time to first action dropped, service scheduling completion improved, and the design system gained a Brazilian module that's still in active use.",
      ],
      metrics: [
        { n: "−42%", l: "Taps to schedule" },
        { n: "4.6/5", l: "App store rating" },
        { n: "3×", l: "Faster onboarding" },
        { n: "1M+", l: "Active users in Brazil" },
      ],
      reflection: [
        "The hardest part was getting a global team, a regional marketing organisation and a dealer network to agree on what \"home\" meant. Once we agreed the home screen serves the driver first, most design decisions followed.",
        "<span class='muted'>I still start every project this way: list what people are trying to do, then work back to the interface.</span>",
      ],
      next: { name: "Coral Brazil", href: "coral.html" },
    };

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<CaseStudyPage data={data} />);
  </script>
