  <script type="text/babel">
    const data = {
      client: "Coral (AkzoNobel)",
      role: "Product Designer",
      year: "2024",
      scope: "Landing pages · Web design",
      title: <>70 years of <span className="serif">colour.</span></>,
      lead: <>Product landing pages for Coral, one of Brazil's best-known paint brands, built on a visual system where colour carries each page.</>,
      cover: "https://framerusercontent.com/images/6uUfpGxnMMLw7kklMyIlYclV4mo.jpg",
      coverAlt: "Coral product landing page designs",

      context: [
        "Coral has been painting Brazilian homes since 1954, and almost everyone in the country knows the name. Online, though, it had become a patchwork: inconsistent landing pages, mixed visual languages, and every product campaign starting from zero.",
        "<span class='muted'>The brief asked for product landing pages that convert. Delivering that meant a system flexible enough to feel custom for each launch and consistent enough to keep the brand's voice.</span>",
      ],
      challenge: [
        "A paint brand sells through how it shows colour. Most product pages showed it as a small swatch next to a paragraph of specs, which suits a hardware catalogue but gives no sense of a finished room.",
        "The system also had to cover Coral's whole range, from premium interior lines to commercial exterior tints, each with its own audience and conversion goal.",
      ],

      approachTitle: "Let the colour lead",
      approach: [
        "I rebuilt the page around colour. The hero became a full-bleed colour field with the product name set over it, and every section below took a tint from that line's palette.",
        "We defined five modules (hero, benefits, specs, inspiration and where to buy), each with a few variants. A premium line gets an editorial layout; a utility line gets a denser spec layout built from the same parts.",
        "<span class='muted'>Every module shipped as a responsive Figma component with copy guidance, imagery rules and a short list of allowed layouts, so the marketing team can publish new pages without breaking the system.</span>",
      ],
      decisions: [
        "<strong>Colour as hero</strong>: the product's signature palette fills 60% of the viewport before any copy is read.",
        "<strong>Editorial typography</strong>: a large display serif with a neutral sans, a softer voice for a brand that sells how a home feels rather than spec sheets.",
        "<strong>Inspiration gallery</strong>: every product page ends with real rooms in real palettes, so people picture what they're making, not just what they're buying.",
        "<strong>Where to buy</strong>: a store finder that shows stock, because most people who browse online still buy in a shop.",
      ],

      outcome: [
        "The landing page system shipped across Coral's product catalogue. Marketing now launches a campaign page in days instead of weeks, and every page reads as the same brand.",
      ],
      metrics: [
        { n: "12+", l: "Product pages" },
        { n: "−60%", l: "Time to launch" },
        { n: "+28%", l: "Session duration" },
        { n: "70 yrs", l: "Of brand heritage" },
      ],
      reflection: [
        "Every marketing campaign wants to feel special and also wants to reuse what already works. Locking the system down doesn't resolve that. Making the consistent option the fastest one to build does.",
        "<span class='muted'>The inspiration module is the part I'm proudest of. It presents Coral as a partner in making a home, which is how the brand has always seen itself.</span>",
      ],
      next: { name: "Tele Sena", href: "telesena.html" },
